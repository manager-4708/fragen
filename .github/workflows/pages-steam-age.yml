name: Pages · Dampfzeitalter

on:
  push:
    branches: [main]
    paths:
      - "steam-age/**"
      - "web/**"
      - "web/templates/**"
      - ".github/workflows/pages-steam-age.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: steam-age/package-lock.json
      - name: Build & sync web
        run: |
          cd steam-age
          npm ci
          npm test
          npm run publish:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
